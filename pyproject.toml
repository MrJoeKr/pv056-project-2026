[project]
name = "pv056-project-2026"
version = "0.1.0"
description = "PV056 project"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pytorch-metric-learning>=2.0.0",
    "scikit-learn>=1.3.0",
    "optuna>=3.4.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "umap-learn>=0.5.0",
    "grad-cam>=1.5.0",
    "Pillow>=9.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "pandas>=2.0.0"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]